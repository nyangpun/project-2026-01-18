<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layouts/default_layout :: layout(~{::title}, ~{::section})}"
>
  <head>
    <title>게임 목록</title>
  </head>
  <body>
    <section>
      <h1>리뷰 목록</h1>
      <p>이 페이지는 게임 목록을 표시합니다.</p>
      <form th:action="@{/review/list}" method="get">
        <select name="searchType">
          <option value="title" th:selected="${searchType == null or searchType == 'title'}">제목</option>
          <option value="tag" th:selected="${searchType == 'tag'}">태그</option>
          <option value="developer" th:selected="${searchType == 'developer'}">개발사</option>
          <option value="publisher" th:selected="${searchType == 'publisher'}">유통사</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" />
        <button type="submit">검색</button>
      </form>
      <div th:if="${recentSearches != null and !recentSearches.isEmpty()}">
        <span>최근 검색어</span>
        <ul>
          <li th:each="r : ${recentSearches}">
            <a th:href="@{/review/list(searchType=${r.searchType},keyword=${r.keyword})}">
              <span th:switch="${r.searchType}">
                <span th:case="'tag'">[태그]</span>
                <span th:case="'developer'">[개발사]</span>
                <span th:case="'publisher'">[유통사]</span>
                <span th:case="*">[제목]</span>
              </span>
              <span th:text="${r.keyword}">검색어</span>
            </a>
          </li>
        </ul>
      </div>
      <ul>
        <li th:each="g : ${gamePage.content}">
          <a
            th:href="@{|/review/game/${g.id}|}"
            th:text="${g.name}"
          >게임 이름</a
          >
        </li>
      </ul>
      <div>
        <a th:if="${gamePage.hasPrevious()}"
           th:href="@{/review/list(page=${gamePage.number},searchType=${searchType},keyword=${keyword})}">
          이전
        </a>

        <span th:text="${gamePage.number + 1}">1</span>
        /
        <span th:text="${gamePage.totalPages}">1</span>

        <a th:if="${gamePage.hasNext()}"
           th:href="@{/review/list(page=${gamePage.number + 2},searchType=${searchType},keyword=${keyword})}">
          다음
        </a>
      </div>
    </section>
  </body>
</html>
